name: 不具合報告
about: 個人情報を含めず、再現手順を報告します
body:
  - type: markdown
    attributes:
      value: |
        ご報告ありがとうございます。

        **住所、氏名、勤務先、職業、病名、薬名、家族構成、正確な位置情報、パスフレーズ、実際のバックアップファイルは書かないでください。**
  - type: input
    id: version
    attributes:
      label: アプリのバージョン
      placeholder: 例: 0.3.1
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: 端末
      options:
        - iPhone / iPad
        - Android
        - macOS
        - Windows
        - Linux
        - その他
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: ブラウザとバージョン
      placeholder: 例: Safari 26
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 個人情報を除いた再現手順
      description: どの画面で、何をすると、何が起きるかを書いてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 個人情報と実際のバックアップファイルを含めていません
          required: true
