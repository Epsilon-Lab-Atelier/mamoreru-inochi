<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f3a">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="守れるいのちは、生活環境のリスク診断、備蓄管理、災害時の行動ガイドをまとめた、無料・広告なし・オフライン対応の防災PWAです。">
  <meta name="application-name" content="守れるいのち">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="守れるいのち">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./assets/styles.css">
  <title>守れるいのち - 暮らしの防災アプリ</title>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <div id="app-shell">
    <header class="site-header" id="site-header">
      <div class="header-inner">
        <a class="brand" href="#/" aria-label="守れるいのち トップへ">
          <img src="./assets/icons/icon-192.png" width="48" height="48" alt="" aria-hidden="true">
          <span class="brand-text">
            <strong>守れるいのち</strong>
            <small>暮らしの防災アプリ</small>
          </span>
        </a>
        <div class="header-actions">
          <button class="icon-button" type="button" id="font-decrease" aria-label="文字を小さくする">A-</button>
          <button class="icon-button" type="button" id="font-increase" aria-label="文字を大きくする">A+</button>
          <a class="emergency-header-button" href="#/emergency">今、災害が起きている</a>
        </div>
      </div>
    </header>

    <nav class="primary-nav" aria-label="メインメニュー">
      <div class="nav-inner">
        <a href="#/" data-nav="home">ホーム</a>
        <a href="#/diagnosis" data-nav="diagnosis">リスク診断</a>
        <a href="#/stockpile" data-nav="stockpile">備蓄</a>
        <a href="#/safety" data-nav="safety">家の安全</a>
        <a href="#/learn" data-nav="learn">防災ガイド</a>
        <a href="#/help" data-nav="help">ヘルプ</a>
      </div>
    </nav>

    <aside id="persistent-status" class="persistent-status" aria-label="リスク診断の状態"></aside>

    <main id="main-content" tabindex="-1">
      <div class="loading-screen" role="status" aria-live="polite">
        <div class="loading-mark" aria-hidden="true"></div>
        <p>アプリを準備しています...</p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p><strong>守れるいのち</strong> - 知る。備える。迷わず動く。</p>
        <p>無料・広告なし・アカウント不要。入力内容は、選択した方法に応じてこの端末のブラウザー内だけで扱います。</p>
        <nav aria-label="フッターメニュー">
          <a href="#/help">使い方</a>
          <a href="#/settings">データと設定</a>
          <a href="#/sources">根拠と出典</a>
          <a href="#/about">このアプリについて</a>
        </nav>
        <p class="version">Version 0.1.0 / Developed by EpsilonLab</p>
      </div>
    </footer>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="dialog-root"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
